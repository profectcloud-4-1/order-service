# Order - Delivery간 이벤트 통신을 확인하기 위한 설정 입니다.

# 11/12 -> CI 될 때 자동으로 Order-delivery 통신 테스트도 돌아감감
spring:
  application:
    name: "order-service"
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:order-service-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 1000
  
  # 실제 Docker Kafka 클러스터 연결 설정
  # docker-compose로 실행 중인 Kafka 브로커에 연결
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    sasl.username: ${KAFKA_SASL_USERNAME}
    sasl.password: ${KAFKA_SASL_PASSWORD}
    consumer:
      group-id: test-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  use-fqn: true

server:
  port: 8080

service:
  user:
    url: http://localhost/mock-user
  product:
    url: http://localhost/mock-product
  order:
    url: http://localhost/mock-order
  payment:
    url: http://localhost/mock-payment
  delivery:
    url: http://localhost/mock-delivery
  stock:
    url: http://localhost/mock-stock

  # Kafka 설정은 테스트 코드에서 EmbeddedKafka로 자동 설정됨

logging:
  level:
    root: WARN
    profect.group1.goormdotcom.order: INFO
    profect.group1.goormdotcom.delivery: INFO
